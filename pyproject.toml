[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-nccl"
version = "0.5.0"
description = "A from-scratch collective communications library (ring, tree, and halving-doubling all-reduce over raw TCP) with all four parallelism strategies built on top of it: data parallel, fully sharded, tensor parallel, and pipeline"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "MrMiniMIze" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy",
    "matplotlib",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["mini_nccl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # function calls in argument defaults: fine for argparse
    "SIM108",  # ternaries are not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals deliberately, and benchmarks print tables.
"tests/*" = ["E501"]
"benchmarks/*" = ["E501"]
